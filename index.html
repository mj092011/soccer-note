<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PraiseLog Visual - 感覚で振り返る</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --gradient-start: #8E44AD; --gradient-end: #3498DB;
            --bg-body: #FDFDFD; --color-primary: #8E44AD; --color-accent: #3498DB;
            --radius-main: 25px;
        }
        body { font-family: sans-serif; background-color: var(--bg-body); margin: 0; padding-bottom: 100px; touch-action: manipulation; }
        header { background: linear-gradient(135deg, var(--gradient-start) 0%, var(--gradient-end) 100%); color: white; padding: 30px 20px; border-bottom-radius: var(--radius-main); }
        .container { max-width: 800px; margin: 0 auto; padding: 20px; }
        .card { background: white; border-radius: var(--radius-main); padding: 20px; margin-bottom: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        
        /* 戦術ボード（ピッチ） */
        .pitch {
            width: 100%;
            aspect-ratio: 3 / 2;
            background-color: #5AB574;
            border: 2px solid white;
            border-radius: 15px;
            position: relative;
            overflow: hidden;
            margin: 10px 0;
            background-image: 
                linear-gradient(to right, rgba(255,255,255,0.2) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255,255,255,0.2) 1px, transparent 1px);
            background-size: 20% 100%;
        }
        .pitch::after { /* センターライン */
            content: ''; position: absolute; left: 50%; top: 0; bottom: 0; width: 2px; background: white;
        }
        .piece {
            width: 30px; height: 30px; border-radius: 50%; position: absolute; 
            display: flex; align-items: center; justify-content: center; color: white; font-size: 10px; font-weight: bold;
            cursor: grab; z-index: 10; border: 2px solid white; box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        .piece.team-a { background: #3498DB; } /* 自チーム */
        .piece.team-b { background: #E74C3C; } /* 相手 */

        .video-container { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; margin-top: 10px; border-radius: 10px; }
        .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }

        textarea, input { width: 100%; padding: 15px; border-radius: 15px; border: 1px solid #eee; margin-bottom: 15px; box-sizing: border-box; }
        .btn { background: var(--color-primary); color: white; border: none; padding: 15px; border-radius: 30px; width: 100%; font-weight: bold; }
        .hidden { display: none; }
        nav { position: fixed; bottom: 0; width: 100%; background: white; display: flex; justify-content: space-around; padding: 15px 0; box-shadow: 0 -5px 10px rgba(0,0,0,0.05); }
    </style>
</head>
<body>

<header><h1 style="margin:0; font-size:1.5rem;">PraiseLog Visual</h1></header>

<div class="container">
    <section id="view-list">
        <div id="player-container"></div>
        <button class="btn" onclick="showView('add-player')">+ 選手追加</button>
    </section>

    <section id="view-detail" class="hidden">
        <button onclick="showView('list')" style="border:none; background:none; color:var(--color-primary); margin-bottom:10px;">← 一覧へ</button>
        <div id="detail-header" class="card"></div>

        <div class="card">
            <h3 style="margin:0 0 10px 0;">🎬 動画URL (YouTube)</h3>
            <input type="text" id="log-video" placeholder="https://www.youtube.com/watch?v=...">
            
            <h3 style="margin:20px 0 10px 0;">📍 ボードで状況をメモ</h3>
            <p style="font-size:0.8rem; color:#888;">駒を指で動かして配置を確認しよう</p>
            <div class="pitch" id="tactical-pitch">
                <div class="piece team-a" style="top:40%; left:20%;" draggable="true">自分</div>
                <div class="piece team-b" style="top:45%; left:60%;" draggable="true">相手</div>
                <div class="piece team-a" style="top:60%; left:30%;" draggable="true">味方</div>
            </div>

            <h3 style="margin:20px 0 10px 0;">📝 感覚メモ</h3>
            <textarea id="log-good" rows="3" placeholder="「この位置からこう動いた時、最高の感覚だった！」など"></textarea>
            <button class="btn" onclick="saveLog()">ビジュアル記録を保存 ✨</button>
        </div>

        <div id="log-history"></div>
    </section>

    <section id="view-add-player" class="hidden">
        <div class="card">
            <h3>選手登録</h3>
            <input type="text" id="new-name" placeholder="選手名">
            <button class="btn" onclick="addPlayer()">登録</button>
        </div>
    </section>
</div>

<nav>
    <button onclick="showView('list')"><i class="fas fa-users"></i><br>選手</button>
    <button onclick="location.reload()"><i class="fas fa-sync"></i><br>更新</button>
</nav>

<script>
    let players = JSON.parse(localStorage.getItem('praiseLogVisualV1')) || [];
    let currentPlayerId = null;

    // 駒のドラッグ機能（スマホ・iPad対応）
    document.addEventListener('touchstart', dragStart, false);
    document.addEventListener('touchend', dragEnd, false);
    document.addEventListener('touchmove', drag, false);

    let activeItem = null;
    let currentX; let currentY; let initialX; let initialY; let xOffset = 0; let yOffset = 0;

    function dragStart(e) {
        if (e.target.classList.contains('piece')) {
            activeItem = e.target;
            initialX = e.touches[0].clientX - (activeItem.offsetLeft);
            initialY = e.touches[0].clientY - (activeItem.offsetTop);
        }
    }
    function dragEnd() { activeItem = null; }
    function drag(e) {
        if (activeItem) {
            e.preventDefault();
            currentX = e.touches[0].clientX - initialX;
            currentY = e.touches[0].clientY - initialY;
            activeItem.style.left = currentX + "px";
            activeItem.style.top = currentY + "px";
        }
    }

    // 基本機能
    function showView(v) {
        document.querySelectorAll('section').forEach(s => s.classList.add('hidden'));
        document.getElementById('view-' + v).classList.remove('hidden');
        if(v === 'list') renderList();
    }

    function addPlayer() {
        const p = { id: Date.now(), name: document.getElementById('new-name').value, logs: [] };
        players.push(p); save(); showView('list');
    }

    function openDetail(id) {
        currentPlayerId = id;
        const p = players.find(x => x.id === id);
        document.getElementById('detail-header').innerHTML = `<h2>${p.name}</h2>`;
        renderLogs(p); showView('detail');
    }

    function saveLog() {
        const p = players.find(x => x.id === currentPlayerId);
        const videoUrl = document.getElementById('log-video').value;
        const videoId = videoUrl.includes('v=') ? videoUrl.split('v=')[1].split('&')[0] : null;
        
        const log = {
            date: new Date().toLocaleDateString(),
            good: document.getElementById('log-good').value,
            videoId: videoId
        };
        p.logs.unshift(log); save(); openDetail(currentPlayerId);
        document.getElementById('log-video').value = '';
        document.getElementById('log-good').value = '';
    }

    function renderList() {
        document.getElementById('player-container').innerHTML = players.map(p => `
            <div class="card" onclick="openDetail(${p.id})"><strong>${p.name}</strong></div>
        `).join('');
    }

    function renderLogs(p) {
        document.getElementById('log-history').innerHTML = p.logs.map(l => `
            <div class="card">
                <small>${l.date}</small>
                <p>${l.good}</p>
                ${l.videoId ? `<div class="video-container"><iframe src="https://www.youtube.com/embed/${l.videoId}" frameborder="0" allowfullscreen></iframe></div>` : ''}
            </div>
        `).join('');
    }

    function save() { localStorage.setItem('praiseLogVisualV1', JSON.stringify(players)); }
    renderList();
</script>
</body>
</html>
